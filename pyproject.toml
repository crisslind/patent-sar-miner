[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "patent-sar-miner"
version = "0.4.0"
description = "Measurement-aware chemical-series, uncertainty and SAR validation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Christoffer Lind"}]
dependencies = [
  "jinja2>=3.1",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "rdkit>=2024.3",
  "scikit-learn>=1.5",
  "fastapi>=0.115",
  "pydantic>=2.9",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "nbformat>=5", "ipython>=8", "httpx>=0.27"]
notebook = ["jupyterlab>=4", "ipykernel>=6"]

[project.scripts]
patent-sar-miner = "patent_sar_miner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patent_sar_miner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
